<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #282828, #424242); /* Grey gradient background */
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-section {
            background-color: rgba(60, 60, 60, 0.5); /* Semi-transparent darker grey */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .user-info h1 {
            font-size: 2.2em;
            margin: 0;
            color: #ADD8E6; /* A slightly desaturated light blue for the username */
        }

        .user-info p, .user-info a {
            margin: 0;
            font-size: 1em;
            color: #bdbdbd;
            text-decoration: none;
        }
        
        .user-info a {
            font-weight: bold;
            color: #B0E0E6; /* Light cyan for links */
        }

        .user-info a:hover {
            text-decoration: underline;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            background: url('https://via.placeholder.com/150/e0e0e0?text=User') no-repeat center center; /* Adjusted placeholder color */
            background-size: cover;
            border-radius: 50%;
            border: 4px solid #66BB6A; /* Adjusted green border */
            box-shadow: 0 0 10px rgba(102, 187, 106, 0.4);
        }
        
        .profile-pic:hover {
            border-color: #87CEEB; /* Lighter blue on hover */
            box-shadow: 0 0 15px rgba(135, 206, 235, 0.6);
            transition: all 0.3s ease;
        }

        /* New Button Style for LinkedIn Automation */
        .linkedin-button {
            background-color: #0077b5; /* LinkedIn's primary blue */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px; /* Added spacing from the photo */
        }

        .linkedin-button:hover {
            background-color: #005f91; /* Darker blue on hover */
            transform: scale(1.05); /* Slight grow effect */
        }
        
        /* New style for the link button to be part of the text flow */
        .linkedin-link-button {
            background-color: #0077b5;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
            display: inline-block;
        }
        
        .linkedin-link-button:hover {
            background-color: #005f91;
            text-decoration: none;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .graph-section {
            background-color: rgba(60, 60, 60, 0.5);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .graph-section h2 {
            font-size: 1.5em;
            margin-top: 0;
            color: #f0f0f0;
            text-align: center;
        }
        
        .graph-container {
            height: 350px;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header class="header-section">
            <div class="user-info">
                <h1>falgunpatel2007</h1>
                <p>Email: falgunpatel2007@gmail.com</p>
                <a href="https://www.linkedin.com/in/yourprofile" target="_blank">LinkedIn Profile</a>
                <a href="https://www.udemy.com/user/yourprofile" target="_blank">Udemy Profile</a>
                <a href="#" class="linkedin-link-button">LinkedIn Automation</a>
            </div>
            <div class="profile-section">
                <div class="profile-pic"></div>
                <a href="#" style="color:#B0E0E6;">Change Photo</a>
            </div>
        </header>

        <main class="main-content">
            <div class="graph-section">
                <h2>Market Tracking Graph (Job Fit)</h2>
                <div class="graph-container">
                    <canvas id="marketChart"></canvas>
                </div>
            </div>

            <div class="graph-section">
                <h2>Psychometric Test Score</h2>
                <div class="graph-container">
                    <canvas id="psychometricChart"></canvas>
                </div>
            </div>
        </main>
        
        <div class="footer-links">
            <a href="#" style="color:#B0E0E6;">My Profile</a> | 
            <a href="#" style="color:#B0E0E6;">Settings</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // === Data for Graphs ===
            const marketData = {
                labels: ['Skills Match', 'Interest Alignment', 'Market Demand', 'Personality Fit'],
                datasets: [
                    {
                        label: 'Software Engineer',
                        data: [90, 85, 75, 80],
                        backgroundColor: 'rgba(54, 162, 235, 0.3)',
                        borderColor: 'rgb(54, 162, 235)',
                        pointBackgroundColor: 'rgb(54, 162, 235)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgb(54, 162, 235)',
                        fill: true,
                    },
                    {
                        label: 'Product Manager',
                        data: [75, 90, 88, 92],
                        backgroundColor: 'rgba(255, 99, 132, 0.3)',
                        borderColor: 'rgb(255, 99, 132)',
                        pointBackgroundColor: 'rgb(255, 99, 132)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgb(255, 99, 132)',
                        fill: true,
                    }
                ]
            };

            const psychometricData = {
                labels: ['Emotional', 'Cognitive', 'Personality', 'Verbal', 'Numerical'],
                datasets: [{
                    label: 'My Score',
                    data: [85, 90, 75, 88, 92],
                    backgroundColor: '#B19CD9',
                    borderColor: '#9370DB',
                    borderWidth: 1,
                    hoverBackgroundColor: '#CFC3E5'
                }]
            };
            
            // === Chart Options ===
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        pointLabels: { color: '#e0e0e0', font: { size: 12 } },
                        ticks: {
                            color: '#e0e0e0',
                            backdropColor: 'transparent',
                            showLabelBackdrop: false,
                            display: true
                        },
                        min: 70,
                        max: 95
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        ticks: { color: '#e0e0e0' }
                    },
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        ticks: { color: '#e0e0e0' }
                    }
                },
                plugins: {
                    legend: {
                        labels: {
                            color: '#e0e0e0',
                            font: { size: 14 }
                        }
                    }
                }
            };

            // === Render Graphs ===
            const marketCtx = document.getElementById('marketChart').getContext('2d');
            new Chart(marketCtx, {
                type: 'radar',
                data: marketData,
                options: {
                    ...chartOptions,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#e0e0e0', font: { size: 12 } },
                            ticks: {
                                color: '#e0e0e0',
                                backdropColor: 'transparent',
                                showLabelBackdrop: false,
                                display: true
                            },
                            min: 70,
                            max: 95
                        }
                    }
                }
            });

            const psychometricCtx = document.getElementById('psychometricChart').getContext('2d');
            new Chart(psychometricCtx, {
                type: 'bar',
                data: psychometricData,
                options: chartOptions
            });
        });
    </script>
</body>
</html>
