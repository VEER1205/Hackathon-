<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futuro - Error</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-bg: #0a0a0f;
        --secondary-bg: #1e1e2e;
        --tertiary-bg: #2a2a3a;
        --accent-primary: #00aaff;
        --accent-secondary: #00d4ff;
        --accent-tertiary: #0077cc;
        --text-primary: #e8e8f0;
        --text-secondary: #b8b8c8;
        --text-muted: #888899;
        --border-color: #00aaff;
        --glass-bg: rgba(15, 15, 25, 0.85);
        --glass-border: rgba(0, 170, 255, 0.25);
        --error-color: #ff4757;
        --shadow-glow: 0 0 60px rgba(0, 170, 255, 0.4);
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(ellipse at top, #001133 0%, #000511 30%, #000000 70%);
        background-attachment: fixed;
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Animated background */
      .bg-decoration {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -2;
        overflow: hidden;
      }

      .bg-particle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.05;
        animation: particleFloat 15s infinite linear;
      }

      .bg-particle:nth-child(1) {
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, var(--accent-primary), transparent 70%);
        top: 15%;
        left: 10%;
        animation-delay: 0s;
        animation-duration: 20s;
      }

      .bg-particle:nth-child(2) {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, var(--accent-secondary), transparent 60%);
        top: 50%;
        right: 15%;
        animation-delay: -8s;
        animation-duration: 25s;
      }

      .bg-particle:nth-child(3) {
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, var(--accent-tertiary), transparent 80%);
        bottom: 25%;
        left: 25%;
        animation-delay: -15s;
        animation-duration: 18s;
      }

      @keyframes particleFloat {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(0deg) scale(1);
        }
        25% {
          transform: translateY(-30px) translateX(20px) rotate(90deg) scale(1.1);
        }
        50% {
          transform: translateY(-15px) translateX(-15px) rotate(180deg) scale(0.9);
        }
        75% {
          transform: translateY(25px) translateX(-30px) rotate(270deg) scale(1.05);
        }
      }

      .bg-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(rgba(0, 170, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 170, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: -1;
      }

      /* Error container */
      .error-container {
        text-align: center;
        max-width: 600px;
        padding: 2rem;
        position: relative;
        z-index: 10;
        animation: fadeInUp 0.8s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Error icon */
      .error-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 2rem;
        position: relative;
        animation: float 3s ease-in-out infinite;
      }

      .error-icon-inner {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-glow);
        position: relative;
      }

      .error-icon-inner::after {
        content: "";
        position: absolute;
        inset: -4px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border-radius: 34px;
        z-index: -1;
        opacity: 0.4;
        animation: pulse 2s infinite;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(2deg);
        }
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.6;
        }
      }

      .error-icon svg {
        width: 60px;
        height: 60px;
        color: white;
      }

      /* Error code */
      .error-code {
        font-size: 6rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
        line-height: 1;
        animation: slideIn 0.8s ease-out 0.2s both;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Error title */
      .error-title {
        font-size: 2rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 1rem;
        animation: slideIn 0.8s ease-out 0.3s both;
      }

      /* Error message */
      .error-message {
        font-size: 1.125rem;
        color: var(--text-secondary);
        line-height: 1.6;
        margin-bottom: 2.5rem;
        animation: slideIn 0.8s ease-out 0.4s both;
      }

      /* Buttons */
      .error-actions {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        animation: slideIn 0.8s ease-out 0.5s both;
      }

      .btn {
        padding: 0.875rem 2rem;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 200px;
        justify-content: center;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        color: white;
        box-shadow: 0 4px 20px rgba(0, 170, 255, 0.5);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-glow);
      }

      .btn-secondary {
        background: transparent;
        color: var(--text-secondary);
        border: 2px solid var(--border-color);
      }

      .btn-secondary:hover {
        background: rgba(0, 170, 255, 0.1);
        color: var(--accent-primary);
        border-color: var(--accent-primary);
        transform: translateY(-2px);
      }

      /* Logo */
      .logo-container {
        position: absolute;
        top: 2rem;
        left: 2rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        z-index: 20;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-text {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .error-code {
          font-size: 4rem;
        }

        .error-title {
          font-size: 1.5rem;
        }

        .error-message {
          font-size: 1rem;
        }

        .logo-container {
          top: 1rem;
          left: 1rem;
        }

        .logo-icon {
          width: 32px;
          height: 32px;
        }

        .logo-text {
          font-size: 1.25rem;
        }

        .error-actions {
          width: 100%;
        }

        .btn {
          width: 100%;
        }
      }

      @media (min-width: 769px) {
        .error-actions {
          flex-direction: row;
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated background -->
    <div class="bg-decoration">
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
    </div>

    <!-- Grid overlay -->
    <div class="bg-grid"></div>

    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="url(#gradient)" />
          <path d="M20 10L12 18H18V30H22V18H28L20 10Z" fill="white" />
          <defs>
            <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
              <stop offset="0%" stop-color="#00aaff" />
              <stop offset="100%" stop-color="#00d4ff" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-text">Futuro</span>
    </div>

    <!-- Error container -->
    <div class="error-container">
      <div class="error-icon">
        <div class="error-icon-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>
        </div>
      </div>

      <h1 class="error-code">404</h1>
      <h2 class="error-title">Oops! Page Not Found</h2>
      <p class="error-message">
        The page you're looking for seems to have wandered off into the digital void. 
        Don't worry though, we'll help you get back on track!
      </p>

      <div class="error-actions">
        <a href="/" class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Go Home
        </a>
        <button class="btn btn-secondary" onclick="window.history.back()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
          </svg>
          Go Back
        </button>
      </div>
    </div>

    <script>
      // Optional: Add custom error handling based on URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const errorType = urlParams.get('type');
      const errorTitle = document.querySelector('.error-title');
      const errorMessage = document.querySelector('.error-message');
      const errorCode = document.querySelector('.error-code');

      if (errorType === '500') {
        errorCode.textContent = '500';
        errorTitle.textContent = 'Server Error';
        errorMessage.textContent = 'Something went wrong on our end. Our team has been notified and is working on a fix. Please try again later.';
      } else if (errorType === '403') {
        errorCode.textContent = '403';
        errorTitle.textContent = 'Access Denied';
        errorMessage.textContent = "You don't have permission to access this page. If you believe this is a mistake, please contact support.";
      } else if (errorType === 'offline') {
        errorCode.textContent = '🔌';
        errorTitle.textContent = 'Connection Lost';
        errorMessage.textContent = "It looks like you're offline. Please check your internet connection and try again.";
      }
    </script>
  </body>
</html>
