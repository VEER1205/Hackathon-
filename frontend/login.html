<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page | Futuro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
      }

      body {
        background: #121212;
        background-image: radial-gradient(#555555, #121212);
        color: #e0e0e0;
        overflow-x: hidden;
      }

      .navbar-custom {
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(0, 170, 255, 0.2);
        color: #e0e0e0;
        box-shadow: 0 4px 20px rgba(0, 170, 255, 0.1);
        transition: all 0.3s ease;
        padding: 0.75rem 0;
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .navbar-brand:hover {
        transform: scale(1.05);
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        box-shadow: 0 4px 15px rgba(0, 170, 255, 0.3);
        transition: all 0.3s ease;
        scale: 0.05;
      }

      .logo-icon:hover {
        box-shadow: 0 6px 25px rgba(0, 170, 255, 0.5);
        transform: translateY(-2px);
      }


      .brand-text {
        color: #00aaff;
        font-weight: 700;
        font-size: 1.5rem;
        text-shadow: 0 0 10px rgba(0, 170, 255, 0.3);
        transition: all 0.3s ease;
      }

      .navbar-brand:hover .brand-text {
        text-shadow: 0 0 15px rgba(0, 170, 255, 0.6);
      }

      .navbar-nav {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .nav-link {
        color: #e0e0e0 !important;
        font-weight: 500;
        padding: 0.5rem 1rem !important;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .nav-link::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 170, 255, 0.2), transparent);
        transition: left 0.5s;
      }

      .nav-link:hover::before {
        left: 100%;
      }

      .nav-link:hover {
        color: #00aaff !important;
        background-color: rgba(0, 170, 255, 0.1);
        text-shadow: 0 0 8px rgba(0, 170, 255, 0.6);
        transform: translateY(-2px);
      }

      .nav-link.active {
        color: #00aaff !important;
        background-color: rgba(0, 170, 255, 0.15);
        box-shadow: 0 0 10px rgba(0, 170, 255, 0.3);
      }

      .navbar-toggler {
        border: 1px solid #00aaff;
        padding: 0.25rem 0.5rem;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .navbar-toggler:hover {
        background-color: rgba(0, 170, 255, 0.1);
        box-shadow: 0 0 10px rgba(0, 170, 255, 0.3);
      }

      .navbar-toggler-icon {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%2800, 170, 255, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='m4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
      }

      .main-content-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        gap: 50px;
        padding-top: 120px;
        padding-bottom: 50px;
      }

      .container-box {
        background-color: #1e1e1e;
        border-radius: 30px;
        box-shadow: 0 0 30px rgba(0, 170, 255, 0.3);
        position: relative;
        overflow: hidden;
        width: 768px;
        max-width: 100%;
        min-height: 480px;
        border: 1px solid #00aaff;
      }

      .container-box p {
        font-size: 14px;
        margin: 20px 0;
        color: #b0b0b0;
      }

      .container-box span {
        font-size: 12px;
        color: #999;
      }

      .container-box a {
        color: #00aaff;
        font-size: 13px;
        text-decoration: none;
        margin: 15px 0 10px;
        text-shadow: 0 0 5px rgba(0, 170, 255, 0.5);
      }

      .container-box button {
        background-color: #00aaff;
        color: #fff;
        font-size: 12px;
        padding: 10px 45px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-weight: 600;
        text-transform: uppercase;
        margin-top: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
      }

      .container-box button:hover {
        background-color: #00c0ff;
        box-shadow: 0 0 15px rgba(0, 192, 255, 0.8);
      }

      .container-box form {
        background-color: #1e1e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0 40px;
        height: 100%;
      }

      .container-box input {
        background-color: #2a2a2a;
        color: #e0e0e0;
        border: 1px solid #00aaff;
        margin: 8px 0;
        padding: 10px 15px;
        font-size: 13px;
        border-radius: 8px;
        width: 100%;
        outline: none;
        box-shadow: inset 0 0 5px rgba(0, 170, 255, 0.2);
      }

      .container-box input:focus {
        box-shadow: 0 0 10px rgba(0, 170, 255, 0.8);
      }

      .form-container {
        position: absolute;
        top: 0;
        height: 100%;
        transition: all 0.6s ease-in-out;
      }

      .sign-in {
        left: 0;
        width: 50%;
        z-index: 2;
      }

      .container-box.active .sign-in {
        transform: translateX(100%);
      }

      .sign-up {
        left: 0;
        width: 50%;
        opacity: 0;
        z-index: 1;
      }

      .container-box.active .sign-up {
        transform: translateX(100%);
        opacity: 1;
        z-index: 5;
        animation: move 0.6s;
      }

      @keyframes move {
        50%,
        100% {
          opacity: 1;
          z-index: 5;
        }
      }

      .social-icons {
        margin: 20px 0;
      }

      .social-icons a {
        border: 1px solid #00aaff;
        background-color: rgba(0, 170, 255, 0.1);
        color: #00aaff;
        border-radius: 20%;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        margin: 0 3px;
        width: 40px;
        height: 40px;
        transition: all 0.3s ease;
      }

      .social-icons a:hover {
        background-color: #00aaff;
        color: #fff;
        box-shadow: 0 0 15px rgba(0, 170, 255, 0.8);
      }

      .toggle-container {
        position: absolute;
        top: 0;
        left: 50%;
        width: 50%;
        height: 100%;
        overflow: hidden;
        transition: all 0.6s ease-in-out;
        border-radius: 150px 0 0 100px;
        z-index: 1000;
      }

      .container-box.active .toggle-container {
        transform: translateX(-100%);
        border-radius: 0 150px 100px 0;
      }

      .toggle {
        background: linear-gradient(to right, #003366, #0077b3);
        color: #fff;
        position: relative;
        left: -100%;
        height: 100%;
        width: 200%;
        transition: all 0.6s ease-in-out;
      }

      .container-box.active .toggle {
        transform: translateX(50%);
      }

      .toggle-panel {
        position: absolute;
        width: 50%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0 30px;
        text-align: center;
        top: 0;
        transition: all 0.6s ease-in-out;
      }

      .toggle-left {
        transform: translateX(-200%);
      }

      .container-box.active .toggle-left {
        transform: translateX(0);
      }

      .toggle-right {
        right: 0;
      }

      .container-box.active .toggle-right {
        transform: translateX(200%);
      }

      #spline-container {
        width: 500px;
        height: 500px;
      }

      /* Mobile Responsive */
      @media (max-width: 992px) {
        #spline-container {
          display: none;
        }
        
        .main-content-wrapper {
          padding-top: 100px;
        }
        
        .navbar-nav {
          text-align: center;
          padding-top: 1rem;
        }
        
        .container-box {
          width: 90%;
          margin: 0 auto;
        }
      }

      @media (max-width: 768px) {
        .brand-text {
          font-size: 1.3rem;
        }
        
        .logo-icon {
          width: 35px;
          height: 35px;
          margin-right: 8px;
        }
        
        .logo-icon i {
          font-size: 18px;
        }
        
        .main-content-wrapper {
          padding-top: 80px;
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
      <div class="container-fluid px-4">
        <!-- Logo and Brand -->
        <a class="navbar-brand" href="index.html">
          <div class="logo-icon">
            <img src="logo1.png" alt="">
          </div>
          <span class="brand-text">Futuro</span>
        </a>

        <!-- Mobile Toggle Button -->
        <button 
          class="navbar-toggler" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#navbarNav" 
          aria-controls="navbarNav" 
          aria-expanded="false" 
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a href="index.html" class="nav-link">
                <i class="fas fa-home me-1"></i>Home
              </a>
            </li>
            <li class="nav-item">
              <a href="#features" class="nav-link">
                <i class="fas fa-star me-1"></i>Features
              </a>
            </li>
            <li class="nav-item">
              <a href="#about" class="nav-link">
                <i class="fas fa-info-circle me-1"></i>About
              </a>
            </li>
          </ul>

          <!-- Action Buttons -->
        </div>
      </div>
    </nav>

    <div class="main-content-wrapper">
      <div id="spline-container">
        <script
          type="module"
          src="https://unpkg.com/@splinetool/viewer@1.10.56/build/spline-viewer.js"
        ></script>
        <spline-viewer
          url="https://prod.spline.design/DaC8UYKAAv0obxsv/scene.splinecode"
        ></spline-viewer>
      </div>

      <div class="container-box" id="container">
        <!-- Signup -->
        <div class="form-container sign-up">
          <form id="signupForm">
            <h1 style="color: #00aaff">Create Account</h1>
            <div class="social-icons">
              <a href="#" id="googleSignup"
                ><i class="fa-brands fa-google-plus-g"></i
              ></a>
            </div>
            <span>or use your email for registration</span>
            <input type="text" placeholder="Name" required />
            <input type="email" placeholder="Email" required />
            <input type="password" placeholder="Password" required />
            <button type="submit">Sign Up</button>
          </form>
        </div>

        <!-- Login -->
        <div class="form-container sign-in">
          <form id="loginForm">
            <h1 style="color: #00aaff">Sign In</h1>
            <div class="social-icons">
              <a href="#" id="googleLogin"
                ><i class="fa-brands fa-google-plus-g"></i
              ></a>
            </div>
            <span>or use your email password</span>
            <input type="email" placeholder="Email" required />
            <input type="password" placeholder="Password" required />
            <a href="#">Forget Your Password?</a>
            <button type="submit">Sign In</button>
          </form>
        </div>

        <!-- Toggle -->
        <div class="toggle-container">
          <div class="toggle">
            <div class="toggle-panel toggle-left">
              <h1>Welcome Back!</h1>
              <p>Enter your personal details to use all site features</p>
              <button class="hidden" id="login">Sign In</button>
            </div>
            <div class="toggle-panel toggle-right">
              <h1>Hello, Friend!</h1>
              <p>
                Register with your personal details to use all site features
              </p>
              <button class="hidden" id="register">Sign Up</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      const container = document.getElementById("container");
      const registerBtn = document.getElementById("register");
      const loginBtn = document.getElementById("login");

      registerBtn.addEventListener("click", () => {
        container.classList.add("active");
      });
      loginBtn.addEventListener("click", () => {
        container.classList.remove("active");
      });

      const API_BASE = "https://hackathon-pflh.onrender.com"; // change if backend runs elsewhere

      // Signup
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const inputs = e.target.querySelectorAll("input");
          const name = inputs[0].value;
          const email = inputs[1].value;
          const password = inputs[2].value;

          try {
            const res = await fetch(`${API_BASE}/users/signup`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(
                {
                  username: name,
                  email: email,
                  password: password,
                }
              ),
            });
            if (!res.ok) throw new Error("Signup failed");
            alert("✅ Signup successful! Please login now.");
          } catch (err) {
            alert("❌ Signup Error: " + err.message);
          }
        });

      // Login
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const inputs = e.target.querySelectorAll("input");
          const email = inputs[0].value;
          const password = inputs[1].value;

          try {
            const res = await fetch(`${API_BASE}/users/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(
                {
                  email: email,
                  password: password,
                }
              ),
            });
            if (!res.ok) throw new Error("Login failed");
            const data = await res.json();
            localStorage.setItem("token", data.access_token);
            alert("✅ Login successful!");
            window.location.href ="index.html"; // redirect to dashboard or home
          } catch (err) {
            alert("❌ Login Error: " + err.message);
          }
        });

      // Google Login / Signup
      document.getElementById("googleLogin").addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = `${API_BASE}/auth/google/login`;
      });
      document.getElementById("googleSignup").addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = `${API_BASE}/auth/google/login`;
      });

      // Active nav link highlighting
      document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
          if (link.getAttribute('href') === currentPage || 
              (currentPage.includes('login') && link.textContent.includes('Sign In'))) {
            link.classList.add('active');
          }
        });
      });
    </script>
  </body>
</html>
