<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e40af;
            --secondary-blue: #3b82f6;
            --accent-blue: #60a5fa;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #334155;
            --gradient: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .progress-container {
            background: var(--dark-bg);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 8px;
            background: var(--gradient);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--dark-bg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .question-card {
            background: var(--dark-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .question-number {
            color: var(--accent-blue);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--card-bg);
        }

        .option:hover {
            border-color: var(--secondary-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .option.selected {
            border-color: var(--secondary-blue);
            background: rgba(59, 130, 246, 0.2);
        }

        .option input[type="radio"] {
            margin-right: 12px;
            width: auto;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .skill-card {
            background: var(--dark-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .skill-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--accent-blue);
        }

        .skill-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .skill-score {
            font-size: 2rem;
            font-weight: bold;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .skill-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .career-recommendations {
            margin-top: 30px;
        }

        .career-card {
            background: var(--dark-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--secondary-blue);
        }

        .career-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent-blue);
        }

        .career-match {
            background: var(--gradient);
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
        }

        .career-description {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .career-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .roadmap-section {
            margin-top: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .roadmap-step {
            display: flex;
            margin-bottom: 20px;
            position: relative;
        }

        .roadmap-step::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 40px;
            bottom: -20px;
            width: 2px;
            background: var(--border);
        }

        .roadmap-step:last-child::before {
            display: none;
        }

        .step-number {
            width: 30px;
            height: 30px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .step-content h4 {
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .step-content p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
            
            .btn-container {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

        function startAssessment() {
            // Set default education level to school for general audience
            assessmentData.userInfo = { education: 'school' };
            
            loadQuestions();
            displayQuestion();
            updateProgress();
        }

        // Initialize assessment when page loads
        document.addEventListener('DOMContentLoaded', function() {
            startAssessment();
        });

        function loadQuestions() {
            const education = assessmentData.userInfo.education;
            assessmentData.questions = questionBank[education === 'school' ? 'school' : 'college'];
        }

        function displayQuestion() {
            const questionIndex = assessmentData.currentQuestion;
            const question = assessmentData.questions[questionIndex];
            
            const container = document.getElementById('questionContainer');
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${questionIndex + 1} of ${assessmentData.questions.length}</div>
                    <h3 class="question-text">${question.question}</h3>
                    <div class="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">
                                <input type="radio" name="q${questionIndex}" id="q${questionIndex}_${index}" value="${index}">
                                <label for="q${questionIndex}_${index}">${option.text}</label>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // Restore previous answer if exists
            if (assessmentData.answers[questionIndex] !== undefined) {
                const selectedIndex = assessmentData.answers[questionIndex];
                const radio = document.getElementById(`q${questionIndex}_${selectedIndex}`);
                const option = radio.parentElement;
                radio.checked = true;
                option.classList.add('selected');
            }

            updateNavigationButtons();
        }

        function selectOption(optionIndex) {
            const questionIndex = assessmentData.currentQuestion;
            
            // Remove previous selection
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            
            // Add selection to clicked option
            const selectedOption = document.querySelectorAll('.option')[optionIndex];
            const radio = selectedOption.querySelector('input');
            radio.checked = true;
            selectedOption.classList.add('selected');
            
            assessmentData.answers[questionIndex] = optionIndex;
            
            // Update scores
            const question = assessmentData.questions[questionIndex];
            const scores = question.options[optionIndex].scores;
            
            // Remove previous scores for this question if any
            if (assessmentData.previousScores && assessmentData.previousScores[questionIndex]) {
                Object.keys(assessmentData.previousScores[questionIndex]).forEach(skill => {
                    assessmentData.scores[skill] -= assessmentData.previousScores[questionIndex][skill];
                });
            }
            
            // Add new scores
            Object.keys(scores).forEach(skill => {
                assessmentData.scores[skill] += scores[skill];
            });
            
            // Store current scores for this question
            if (!assessmentData.previousScores) assessmentData.previousScores = {};
            assessmentData.previousScores[questionIndex] = { ...scores };
            
            updateNavigationButtons();
        }

        function nextQuestion() {
            if (assessmentData.answers[assessmentData.currentQuestion] === undefined) {
                alert('Please select an answer before continuing.');
                return;
            }
            
            if (assessmentData.currentQuestion < assessmentData.questions.length - 1) {
                assessmentData.currentQuestion++;
                displayQuestion();
                updateProgress();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (assessmentData.currentQuestion > 0) {
                assessmentData.currentQuestion--;
                displayQuestion();
                updateProgress();
            }
        }

        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = assessmentData.currentQuestion === 0;
            
            if (assessmentData.currentQuestion === assessmentData.questions.length - 1) {
                nextBtn.innerHTML = '<i class="fas fa-flag-checkered"></i> Complete Assessment';
            } else {
                nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
            }
        }

        function updateProgress() {
            const progress = ((assessmentData.currentQuestion + 1) / assessmentData.questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${Math.round(progress)}% Complete`;
        }

        function showResults() {
            document.getElementById('questionsSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');
            
            // Normalize scores to percentages
            const maxPossibleScore = assessmentData.questions.length * 3; // Maximum score per skill
            const normalizedScores = {};
            
            Object.keys(assessmentData.scores).forEach(skill => {
                normalizedScores[skill] = Math.round((assessmentData.scores[skill] / maxPossibleScore) * 100);
            });
            
            displaySkillResults(normalizedScores);
            displayCareerRecommendations(normalizedScores);
            updateProgress();
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = '100% Complete - Results Ready!';
        }

        function displaySkillResults(scores) {
            const skillsGrid = document.getElementById('skillsGrid');
            skillsGrid.innerHTML = Object.keys(scores).map(skill => {
                const skillData = skillDescriptions[skill];
                const score = scores[skill];
                return `
                    <div class="skill-card">
                        <div class="skill-icon">
                            <i class="${skillData.icon}"></i>
                        </div>
                        <div class="skill-name">${skillData.name}</div>
                        <div class="skill-score">${score}%</div>
                        <div class="skill-description">${skillData.description}</div>
                    </div>
                `;
            }).join('');
        }

        function displayCareerRecommendations(scores) {
            // Calculate career matches
            const careerMatches = careerDatabase.map(career => ({
                ...career,
                score: Math.round(career.match(scores))
            })).sort((a, b) => b.score - a.score);
            
            // Display top 5 career recommendations
            const topCareers = careerMatches.slice(0, 5);
            const recommendationsContainer = document.getElementById('careerRecommendations');
            
            recommendationsContainer.innerHTML = topCareers.map(career => `
                <div class="career-card">
                    <div class="career-title">${career.title}</div>
                    <div class="career-match">${career.score}% Match</div>
                    <div class="career-description">${career.description}</div>
                    <div class="career-skills">
                        ${career.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            
            // Store top career for roadmap
            assessmentData.topCareer = topCareers[0];
        }

        function showRoadmap() {
            const roadmapSection = document.getElementById('roadmapSection');
            const roadmapContent = document.getElementById('roadmapContent');
            
            const career = assessmentData.topCareer;
            
            roadmapContent.innerHTML = `
                <h4>Career Path: ${career.title}</h4>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">Based on your ${career.score}% match, here's your personalized roadmap:</p>
                ${career.roadmap.map((step, index) => `
                    <div class="roadmap-step">
                        <div class="step-number">${index + 1}</div>
                        <div class="step-content">
                            <h4>${step.title}</h4>
                            <p>${step.description}</p>
                        </div>
                    </div>
                `).join('')}
                <div style="margin-top: 20px; padding: 15px; background: var(--card-bg); border-radius: 8px; border-left: 4px solid var(--secondary-blue);">
                    <strong>💡 Pro Tip:</strong> Focus on building a strong foundation in your top skills while gradually developing complementary abilities. Consider seeking mentorship and gaining practical experience through internships or personal projects.
                </div>
            `;
            
            roadmapSection.classList.remove('hidden');
            roadmapSection.scrollIntoView({ behavior: 'smooth' });
        }
